[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-privacy-ai-assistant"
version = "0.1.0"
description = "Local RAG assistant for private Home Assistant data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Xingfan Lin" }]
dependencies = [
  "chromadb>=0.5.0",
  "fastapi>=0.110.0",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "sentence-transformers>=3.0.0",
  "uvicorn[standard]>=0.29.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["local_privacy_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
